<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Successo del Pagamento</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center">Pagamento completato con successo!</h1>

    <div class="card mt-4">
        <div class="card-header">
            <h4>Recap del Pagamento</h4>
        </div>
        <div class="card-body">
            <p><strong>ID del Pagamento:</strong> <span th:text="${paymentId}"></span></p>
            <p><strong>Stato del Pagamento:</strong> <span th:text="${state}"></span></p>
            <p><strong>Importo Totale:</strong> <span th:text="${totalAmount}"></span> <span th:text="${currency}"></span></p>
            <p><strong>Email del Pagante:</strong> <span th:text="${payerEmail}"></span></p>
            <p><strong>Data di Creazione:</strong> <span th:text="${createTime}"></span></p>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-header">
            <h4>Dettagli delle Transazioni</h4>
        </div>
        <div class="card-body">
            <table class="table">
                <thead>
                <tr>
                    <th>Descrizione</th>
                    <th>Importo</th>
                    <th>Valuta</th>
                </tr>
                </thead>
                <tbody>
                <!-- Ciclo su tutte le transazioni -->
                <tr th:each="transaction : ${transactions}">
                    <td th:text="${transaction.description}"></td>
                    <td th:text="${transaction.amount.total}"></td>
                    <td th:text="${transaction.amount.currency}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="text-center mt-4">
        <a href="/" class="btn btn-primary">Torna alla Home</a>
    </div>
</div>
</body>
</html>
